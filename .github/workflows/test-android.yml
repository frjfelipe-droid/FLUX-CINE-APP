name: Testar edição no Android
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Vídeos de exemplo
        run: |
          mkdir -p www/media
          for id in 1240 1238 39878 1232 39765 39875; do
            curl -sSfL --retry 3 -o www/media/$id.mp4 https://assets.mixkit.co/videos/$id/$id-360.mp4
          done
      - run: npm ci
      - run: npx cap sync android
      - name: Modelo de voz em português
        run: |
          curl -sSfL --retry 3 -o /tmp/vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          unzip -q /tmp/vosk.zip -d /tmp/vosk
          rm -rf android/app/src/main/assets/vosk-pt
          mv /tmp/vosk/vosk-model-small-pt-0.3 android/app/src/main/assets/vosk-pt
      - name: Vídeo de teste com fala e pausas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null
          espeak-ng -v pt-br -s 135 -w /tmp/f1.wav "Olá, eu sou a Ana. Hoje eu vou te mostrar três erros."
          espeak-ng -v pt-br -s 135 -w /tmp/f2.wav "Esses erros fazem você perder clientes todos os dias. Fique até o final."
          ffmpeg -y -loglevel error -f lavfi -t 1.5 -i anullsrc=r=22050:cl=mono -i /tmp/f1.wav -f lavfi -t 2.0 -i anullsrc=r=22050:cl=mono -i /tmp/f2.wav -f lavfi -t 1.5 -i anullsrc=r=22050:cl=mono \
            -filter_complex "[0][1][2][3][4]concat=n=5:v=0:a=1[a]" -map "[a]" /tmp/fala.wav
          mkdir -p android/app/src/androidTest/assets
          ffmpeg -y -loglevel error -stream_loop -1 -i www/media/1238.mp4 -i /tmp/fala.wav -map 0:v -map 1:a -shortest \
            -vf "scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280" -r 30 -c:v libx264 -pix_fmt yuv420p -c:a aac -ar 44100 -ac 2 \
            android/app/src/androidTest/assets/test.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 android/app/src/androidTest/assets/test.mp4
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rodar teste no Android virtual
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          working-directory: android
          script: |
            chmod +x gradlew
            mkdir -p ../frames
            ./gradlew :app:connectedDebugAndroidTest --no-daemon -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch ../frames/FAILED
            adb logcat -d > ../frames/logcat.txt || true
            adb pull /sdcard/Download/fluxtest/. ../frames/ || true
            ls -la ../frames
      - name: Publicar resultado do teste
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-frames
          name: Resultado do teste automático
          prerelease: true
          make_latest: false
          files: |
            frames/*
      - name: Falhou?
        run: test ! -f frames/FAILED
