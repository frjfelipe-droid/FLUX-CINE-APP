name: Gerar APK do FLUX CINE
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Vídeos de exemplo dos modelos (Mixkit, licença gratuita)
        run: |
          mkdir -p www/media
          for id in 1240 1238 39878 1232 39765 39875; do
            curl -sSfL --retry 3 -o www/media/$id.mp4 https://assets.mixkit.co/videos/$id/$id-360.mp4
          done
          ls -la www/media
      - run: npm ci
      - run: npx cap sync android
      - name: Modelo de voz em português (Vosk, offline)
        run: |
          curl -sSfL --retry 3 -o /tmp/vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          unzip -q /tmp/vosk.zip -d /tmp/vosk
          rm -rf android/app/src/main/assets/vosk-pt
          mv /tmp/vosk/vosk-model-small-pt-0.3 android/app/src/main/assets/vosk-pt
          du -sh android/app/src/main/assets/vosk-pt
      - name: Compilar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk FLUX-CINE.apk
      - uses: actions/upload-artifact@v4
        with: { name: FLUX-CINE-apk, path: FLUX-CINE.apk }
      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: FLUX CINE v2.0.${{ github.run_number }}
          body: Baixe o arquivo FLUX-CINE.apk abaixo e instale no Android.
          files: FLUX-CINE.apk
          make_latest: true
