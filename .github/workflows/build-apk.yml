name: Gerar APK do FLUX CINE
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk FLUX-CINE.apk
      - uses: actions/upload-artifact@v4
        with: { name: FLUX-CINE-apk, path: FLUX-CINE.apk }
      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FLUX CINE v1.0.${{ github.run_number }}
          body: Baixe o arquivo FLUX-CINE.apk abaixo e instale no Android.
          files: FLUX-CINE.apk
          make_latest: true
