<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050505">
<title>FLUX CINE</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app"></div>
<input id="file" type="file" accept="video/*" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
window.addEventListener('error', function (e) {
  var a = document.getElementById('app');
  if (a && !a.children.length) a.innerHTML = '<div style="padding:40px 24px;font:14px Inter,sans-serif;color:#FCA5A5">Erro ao abrir o FLUX CINE:<br>' + String(e.message).replace(/</g,'&lt;') + '</div>';
});
</script>
<script src="capacitor.js"></script>
<script src="titles.js"></script>
<script src="app.js"></script>
</body>
</html>
